<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智环引诊 - 科室排队详情</title>
    <link rel="stylesheet" href="/control-center/css/common.css">
    <link rel="stylesheet" href="/control-center/css/analytics.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <h1>智环引诊</h1>
                <p>云端调度中心</p>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/dashboard" class="nav-link">首页</a>
                </li>
                <li class="nav-item">
                    <a href="/dispatch" class="nav-link active">调度管理</a>
                </li>
                <li class="nav-item">
                    <a href="/emergency" class="nav-link">紧急情况</a>
                </li>
                <li class="nav-item">
                    <a href="/analytics" class="nav-link">数据分析</a>
                </li>
                <li class="nav-item">
                    <a href="/settings" class="nav-link">系统设置</a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="btn" style="margin-right: 12px; padding: 6px 12px;" onclick="goBack()">返回</button>
                    <div>
                        <h2 id="deptTitle">科室排队详情</h2>
                        <p style="font-size: 13px; color: #666; margin-top: 4px;" id="queueCount">排队总人数：0</p>
                    </div>
                </div>
                <div class="header-right">
                    <span class="date-info" id="dateInfo">2026-04-29 14:35:28</span>
                    <button class="btn success" onclick="exportQueue()">导出列表</button>
                </div>
            </header>

            <div class="filter-bar">
                <div class="filter-group">
                    <span class="filter-label">排序方式:</span>
                    <select class="filter-select" onchange="sortQueue()">
                        <option value="time">按到达时间</option>
                        <option value="priority">按优先级</option>
                        <option value="name">按姓名</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">状态:</span>
                    <select class="filter-select" onchange="filterQueue()">
                        <option value="all">全部</option>
                        <option value="waiting">等待中</option>
                        <option value="calling">叫号中</option>
                        <option value="completed">已就诊</option>
                    </select>
                </div>
                <button class="btn" onclick="refreshQueue()">刷新</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">排队人员列表</h4>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>姓名</th>
                                <th>性别</th>
                                <th>年龄</th>
                                <th>到达时间</th>
                                <th>等待时长</th>
                                <th>优先级</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="queueTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api-config.js"></script>
    <script src="/js/mock-data.js"></script>
    <script src="/control-center/js/queue-detail.js"></script>
</body>

</html>
