<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智环引诊 - 警报列表</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/analytics.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <h1>智环引诊</h1>
                <p>云端调度中心</p>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">首页</a>
                </li>
                <li class="nav-item">
                    <a href="dispatch.html" class="nav-link">调度管理</a>
                </li>
                <li class="nav-item">
                    <a href="emergency.html" class="nav-link active">紧急情况</a>
                </li>
                <li class="nav-item">
                    <a href="analytics.html" class="nav-link">数据分析</a>
                </li>
                <li class="nav-item">
                    <a href="settings.html" class="nav-link">系统设置</a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="btn" style="margin-right: 12px; padding: 6px 12px;" onclick="goBack()">返回</button>
                    <div>
                        <h2>警报列表</h2>
                        <p style="font-size: 13px; color: #666; margin-top: 4px;">所有警报记录</p>
                    </div>
                </div>
                <div class="header-right">
                    <span class="date-info" id="dateInfo">2026-04-29 14:35:28</span>
                    <button class="btn success" onclick="exportAlarms()">导出记录</button>
                </div>
            </header>

            <div class="filter-bar">
                <div class="filter-group">
                    <span class="filter-label">状态:</span>
                    <select class="filter-select" onchange="filterAlarms()">
                        <option value="all">全部</option>
                        <option value="pending">待处理</option>
                        <option value="processing">处理中</option>
                        <option value="completed">已处理</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">优先级:</span>
                    <select class="filter-select" onchange="filterAlarms()">
                        <option value="all">全部</option>
                        <option value="high">紧急</option>
                        <option value="medium">中等</option>
                        <option value="low">一般</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">时间范围:</span>
                    <select class="filter-select" onchange="filterAlarms()">
                        <option value="today">今日</option>
                        <option value="week">本周</option>
                        <option value="month">本月</option>
                    </select>
                </div>
                <button class="btn" onclick="refreshAlarms()">刷新</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">警报记录</h4>
                    <span style="font-size: 12px; color: #666;" id="alarmCount">加载中...</span>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>位置</th>
                                <th>描述</th>
                                <th>优先级</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="alarmTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api-config.js"></script>
    <script src="/js/mock-data.js"></script>
    <script src="../js/alarm-list.js"></script>
</body>

</html>
