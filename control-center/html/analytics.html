<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智环引诊 - 数据分析</title>
    <link rel="stylesheet" href="/control-center/css/common.css">
    <link rel="stylesheet" href="/control-center/css/analytics.css">
</head>

<body>
    <div class="container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="logo">
                <h1>智环引诊</h1>
                <p>云端调度中心</p>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/control-center/html/index.html" class="nav-link">首页</a>
                </li>
                <li class="nav-item">
                    <a href="/control-center/html/dispatch.html" class="nav-link">调度管理</a>
                </li>
                <li class="nav-item">
                    <a href="/control-center/html/bracelet.html" class="nav-link">手环管理</a>
                </li>
                <li class="nav-item">
                    <a href="/control-center/html/task-monitor.html" class="nav-link">任务监控</a>
                </li>
                <li class="nav-item">
                    <a href="/control-center/html/emergency.html" class="nav-link">紧急情况</a>
                </li>
                <li class="nav-item">
                    <a href="/control-center/html/analytics.html" class="nav-link active">数据分析</a>
                </li>
                <li class="nav-item">
                    <a href="/control-center/html/settings.html" class="nav-link">系统设置</a>
                </li>
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部头部 -->
            <header class="top-header">
                <div class="header-left">
                    <h2>数据分析中心</h2>
                    <p style="font-size: 13px; color: #666; margin-top: 4px;">数据统计与可视化报表</p>
                </div>
                <div class="header-right">
                    <span class="date-info" id="dateInfo">2026-04-29</span>
                    <button class="btn success" onclick="exportReport()">导出报表</button>
                </div>
            </header>

            <!-- 筛选区域 -->
            <div class="filter-bar" id="filterBar">
                <div class="filter-group">
                    <span class="filter-label">时间范围:</span>
                    <select class="filter-select" id="filterTimeRange" onchange="onTimeRangeChange()">
                        <option value="month">本月</option>
                        <option value="week">本周</option>
                        <option value="today">今日</option>
                        <option value="custom">自定义</option>
                    </select>
                </div>
                <div class="filter-group" id="customDateGroup" style="display:none;">
                    <span class="filter-label">起:</span>
                    <input type="date" class="filter-date" id="filterStartDate" />
                    <span class="filter-label">止:</span>
                    <input type="date" class="filter-date" id="filterEndDate" />
                </div>
                <div class="filter-group">
                    <span class="filter-label">报告类型:</span>
                    <select class="filter-select" id="filterReportType">
                        <option value="all">就诊统计</option>
                        <option value="dept">科室负载</option>
                        <option value="triage">分流效果</option>
                        <option value="satisfaction">患者满意度</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-label">导出格式:</span>
                    <select class="filter-select" id="filterExportFormat">
                        <option>Excel</option>
                        <option>PDF</option>
                        <option>CSV</option>
                    </select>
                </div>
                <button class="btn" id="btnQuery" onclick="queryData()">查询</button>
                <button class="btn btn-reset" id="btnReset" onclick="resetFilter()">重置</button>
            </div>

            <!-- 月度就诊趋势 -->
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">月度就诊趋势</h4>
                    <span id="monthlyTrendTotal" style="font-size: 12px; color: #666;">加载中...</span>
                </div>
                <div class="chart-container" id="monthlyTrendChart">
                    <div class="chart-y-axis" id="chartYAxis"></div>
                    <div class="bar-chart" id="monthlyBars"></div>
                </div>
            </div>

            <!-- 双栏布局 -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <!-- 科室就诊量排行 -->
                <div class="card">
                    <div class="card-header">
                        <h4 class="card-title">科室就诊量排行</h4>
                    </div>
                    <div class="rank-container" id="deptRankingChart">
                        <div class="rank-list" id="deptRankingList">
                            <div style="text-align:center;padding:40px;color:#999;">加载中...</div>
                        </div>
                    </div>
                </div>

                <!-- 患者满意度分布 -->
                <div class="card">
                    <div class="card-header">
                        <h4 class="card-title">患者满意度分布</h4>
                    </div>
                    <div class="satisfaction-container" id="satisfactionChart">
                        <div class="pie-legend" id="satisfactionLegend" style="text-align:center;padding:40px;color:#999;">加载中...</div>
                    </div>
                </div>
            </div>

            <!-- 详细数据表格 -->
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">就诊统计详情</h4>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>就诊人数</th>
                                <th>平均等待时间</th>
                                <th>满意度</th>
                                <th>环比变化</th>
                            </tr>
                        </thead>
                        <tbody id="detailTableBody">
                            <tr><td colspan="5" style="text-align:center;color:#999;padding:20px;">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api-config.js"></script>
    <script src="/js/mock-data.js"></script>
    <script src="/control-center/js/analytics.js"></script>
</body>

</html>
