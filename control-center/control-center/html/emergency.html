<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智环引诊 - 紧急情况</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/emergency.css">
</head>

<body>
    <div class="container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="logo">
                <h1>智环引诊</h1>
                <p>云端调度中心</p>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">首页</a>
                </li>
                <li class="nav-item">
                    <a href="dispatch.html" class="nav-link">调度管理</a>
                </li>
                <li class="nav-item">
                    <a href="bracelet.html" class="nav-link">手环管理</a>
                </li>
                <li class="nav-item">
                    <a href="emergency.html" class="nav-link active">紧急情况</a>
                </li>
                <li class="nav-item">
                    <a href="analytics.html" class="nav-link">数据分析</a>
                </li>
                <li class="nav-item">
                    <a href="settings.html" class="nav-link">系统设置</a>
                </li>
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部头部 -->
            <header class="top-header">
                <div class="header-left">
                    <h2>紧急情况处理中心</h2>
                    <p style="font-size: 13px; color: #666; margin-top: 4px;">实时监控与响应</p>
                </div>
                <div class="header-right">
                    <span class="date-info" id="dateInfo">2026-04-29 14:35:28</span>
                    <button class="btn danger" onclick="emergencyBroadcast()">紧急广播</button>
                    <button class="btn success" onclick="exportRecords()">导出记录</button>
                </div>
            </header>

            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card danger">
                    <div class="stat-value" id="statPending">--</div>
                    <div class="stat-label">待处理警报</div>
                </div>
                <div class="stat-card warning">
                    <div class="stat-value" id="statProcessing">--</div>
                    <div class="stat-label">处理中</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-value" id="statCompleted">--</div>
                    <div class="stat-label">今日已处理</div>
                </div>
                <div class="stat-card info">
                    <div class="stat-value" id="statAvgTime">--</div>
                    <div class="stat-label">平均响应时间</div>
                </div>
            </div>

            <!-- 紧急警报列表 -->
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">实时警报列表</h4>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="font-size: 12px; color: #666;" id="alarmCountLabel">加载中...</span>
                        <button class="btn-sm" style="background: #5c7cfa; color: white;" onclick="goToAlarmList()">更多</button>
                    </div>
                </div>
                <div class="alarm-list" id="alarmListContainer">
                    <div class="sk-card"><div class="sk-line w80"></div><div class="sk-line w60"></div><div class="sk-line w40"></div></div>
                    <div class="sk-card"><div class="sk-line w70"></div><div class="sk-line w50"></div></div>
                </div>
            </div>

            <!-- 历史记录 -->
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title">今日处理记录</h4>
                </div>
                <div style="max-height: 200px; overflow-y: auto;">
                    <table style="width: 100%; font-size: 12px;">
                        <thead>
                            <tr style="background: #f8f9fa;">
                                <th style="padding: 10px; text-align: left; color: #666;">时间</th>
                                <th style="padding: 10px; text-align: left; color: #666;">位置</th>
                                <th style="padding: 10px; text-align: left; color: #666;">类型</th>
                                <th style="padding: 10px; text-align: left; color: #666;">状态</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr><td colspan="4" style="padding:20px;text-align:center;color:#959BA3;">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 患者详情弹窗 -->
    <div class="modal-overlay" id="patientModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">患者详情</span>
                <span class="modal-close" onclick="closeModal()">×</span>
            </div>
            <div class="modal-body">
                <div class="patient-info">
                    <div class="patient-avatar"></div>
                    <div class="patient-details">
                        <span class="patient-name" id="patientName">王大爷</span>
                        <span class="patient-id">就诊ID: #1082</span>
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">年龄</span>
                    <span class="info-value">78岁</span>
                </div>
                <div class="info-row">
                    <span class="info-label">性别</span>
                    <span class="info-value">男</span>
                </div>
                <div class="info-row">
                    <span class="info-label">就诊科室</span>
                    <span class="info-value">心内科</span>
                </div>
                <div class="info-row">
                    <span class="info-label">当前位置</span>
                    <span class="info-value">2F-洗手间附近</span>
                </div>
                <div class="info-row">
                    <span class="info-label">求助类型</span>
                    <span class="info-value">紧急求助</span>
                </div>
                <div class="info-row">
                    <span class="info-label">病史摘要</span>
                    <span class="info-value">高血压Ⅱ期，需定期复查</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">关闭</button>
                <button class="btn success" onclick="handlePatient()">立即处理</button>
            </div>
        </div>
    </div>

    <script src="/js/api-config.js"></script>
    <script src="/js/mock-data.js"></script>
    <script src="../js/emergency.js"></script>
    <script src="../js/alarm-realtime.js"></script>
</body>

</html>
